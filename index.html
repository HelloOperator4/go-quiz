<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f7fb" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0d1420" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Go Quiz">
  <meta name="description" content="Тренажёр Go: теория и разбор кода по пройденным темам.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg">
  <link rel="apple-touch-icon" href="./icons/icon-180.png">
  <link rel="stylesheet" href="./styles.css">
  <title>Go Quiz — тренажёр языка Go</title>
  <script defer src="./app.js"></script>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand" id="brand-home" role="button" tabindex="0" aria-label="На главную">
        <img src="./icons/icon.svg" alt="" width="43" height="43">
        <span><strong>Go Quiz</strong><small>Твой тренажёр Go</small></span>
      </div>
      <span class="top-chip">v1.1 · офлайн</span>
    </header>
    <main id="app" class="main" aria-live="off"><div class="loading"><div class="loader"></div>Загружаем вопросы…</div></main>
    <nav class="bottom-nav" id="bottom-nav" aria-label="Основная навигация">
      <button type="button" class="nav-btn active" data-route="home" aria-current="page"><span aria-hidden="true">⌂</span><small>Темы</small></button>
      <button type="button" class="nav-btn" data-route="stats"><span aria-hidden="true">▥</span><small>Прогресс</small></button>
      <button type="button" class="nav-btn" data-route="about"><span aria-hidden="true">ⓘ</span><small>О приложении</small></button>
    </nav>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
